<title>Habitrak 3.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,700&display=swap">
<style>
/* Layout: one phone-width column, app bar on top, tiles and timeline in the middle, nav pinned to the bottom. */
:root{
  --bg:#F8FAF8; --ink:#17201E; --muted:#58645F; --line:#CCD5D1;
  --brand:#1C6A61; --on-brand:#FFFFFF; --brand-soft:#D3E7E2; --tile:#EEF3F1; --hatch:#00000010; --bad:#B23A3A;
  --t-work:#3E63A8; --t-walk:#2F8A5B; --t-commute:#6B7480; --t-rest:#8A6BC1; --t-screen:#B5507A; --t-sleep:#33407A;
  --t-coffee:#8A5A34; --t-water:#1E8DB0; --t-meal:#C2871B; --t-smoke:#5B7489; --t-drink:#B4602A; --t-meds:#C24A4A; --t-snack:#7E8F2B; --t-stretch:#2E8C7E; --t-workout:#C0512F;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Roboto Flex",Roboto,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141A19; --ink:#E3EAE7; --muted:#97A39F; --line:#2E3936;
  --brand:#7FCBBE; --on-brand:#0D2522; --brand-soft:#21403B; --tile:#212A28; --hatch:#FFFFFF0D; --bad:#F08A80;
  --t-work:#86A6E6; --t-walk:#6CC795; --t-commute:#A3ABB6; --t-rest:#B9A0EC; --t-screen:#E58BB0; --t-sleep:#8F9CE0;
  --t-coffee:#C99A70; --t-water:#62C3E2; --t-meal:#E8B54F; --t-smoke:#9DB4C7; --t-drink:#E39A66; --t-meds:#EE8A8A; --t-snack:#B9C966; --t-stretch:#6FCFC0; --t-workout:#F09A7A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A19; --ink:#E3EAE7; --muted:#97A39F; --line:#2E3936;
  --brand:#7FCBBE; --on-brand:#0D2522; --brand-soft:#21403B; --tile:#212A28; --hatch:#FFFFFF0D; --bad:#F08A80;
  --t-work:#86A6E6; --t-walk:#6CC795; --t-commute:#A3ABB6; --t-rest:#B9A0EC; --t-screen:#E58BB0; --t-sleep:#8F9CE0;
  --t-coffee:#C99A70; --t-water:#62C3E2; --t-meal:#E8B54F; --t-smoke:#9DB4C7; --t-drink:#E39A66; --t-meds:#EE8A8A; --t-snack:#B9C966; --t-stretch:#6FCFC0; --t-workout:#F09A7A;
  color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);height:100%}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.appbar{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:14px 16px 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:3}
.appbar h1{font-family:var(--f-display);font-weight:800;font-size:1.6rem;margin:0;line-height:1.1;letter-spacing:-.01em}
.appbar p{margin:0;color:var(--muted);font-size:.85rem}
.brand{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.brand svg{width:16px;height:16px}
.save{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
.save.err{color:var(--bad);border-color:var(--bad)}
main{flex:1;padding:4px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.card{background:var(--tile);border-radius:20px;padding:12px 14px;margin-bottom:12px}
.nowcard{display:flex;align-items:center;gap:12px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.nowcard .txt{flex:1;min-width:0}
.nowcard b{display:block;font-size:1.05rem}
.nowcard span{color:var(--muted);font-size:.85rem}
.pill{border:0;border-radius:999px;background:var(--brand);color:var(--on-brand);font-weight:700;padding:0 18px;min-height:44px;cursor:pointer}
.pill.tonal{background:var(--brand-soft);color:var(--ink)}
.pill.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.ribbon{display:block;width:100%;height:auto}
.hours{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:4px}
.lbl2{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:4px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.tile{position:relative;border:0;border-radius:18px;background:var(--tile);min-height:84px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--ink);overflow:hidden;transition:transform .12s}
.tile:active{transform:scale(.96)}
.tile svg{width:24px;height:24px;stroke:var(--c);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile .lbl{font-size:.8rem;font-weight:500;line-height:1.15;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tile .val{font-size:.82rem;font-weight:700;line-height:1.15;color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tile.on{background:var(--c);color:var(--bg)}
.tile.on svg{stroke:var(--bg)}
.tile.on .val{color:var(--bg)}
.tile.pulse{animation:pulse .5s ease-out}
@keyframes pulse{0%{box-shadow:inset 0 0 0 0 var(--c)}40%{box-shadow:inset 0 0 0 4px var(--c)}100%{box-shadow:inset 0 0 0 0 transparent}}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.tl li:last-child{border-bottom:0}
.tl .t{color:var(--muted);min-width:72px;font-size:.82rem}
.tl .d{width:10px;height:10px;border-radius:50%;flex:none}
.tl .w{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl button{border:0;background:transparent;color:var(--brand);font-weight:500;min-height:40px;padding:0 6px;cursor:pointer}
.tl button.del{color:var(--bad)}
.tl li.editing .w{flex-basis:calc(100% - 20px)}
.tl label{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.tl input,.field input{border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:40px;padding:0 6px}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--tile);padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px))}
.navbar div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.navbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.74rem;font-weight:500;color:var(--muted);cursor:pointer;min-height:52px}
.navbar i{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:999px}
.navbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.navbar button[aria-current="page"]{color:var(--ink)}
.navbar button[aria-current="page"] i{background:var(--brand-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:14px;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;font-size:.9rem;z-index:6}
.toast span{flex:1}
.toast button{border:0;background:transparent;color:var(--bg);font-weight:700;text-decoration:underline;min-height:40px;padding:0 12px;cursor:pointer}
.weekrow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:6px}
.weekrow span{font-size:.78rem;color:var(--muted);line-height:1.1}
.weekrow span b{display:block;color:var(--ink)}
.obs{background:var(--brand-soft);border-radius:16px;padding:12px 14px;font-size:.92rem;margin:10px 0 12px}
table.tot{width:100%;border-collapse:collapse;font-size:.9rem}
table.tot td{padding:7px 0;border-bottom:1px solid var(--line)}
table.tot td:last-child{text-align:right;font-weight:700}
table.tot tr:last-child td{border-bottom:0}
.goal{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.gi{width:36px;height:36px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center}
.gi svg{width:20px;height:20px;stroke:var(--c);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.goal .rows{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:2px;font-size:.8rem}
.step span{padding-left:8px;color:var(--muted);line-height:1.15}
.step span b{display:block;color:var(--ink);font-size:.92rem}
.step div{display:flex}
.step button{border:0;background:transparent;width:40px;height:44px;font-size:1.15rem;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{position:relative;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:12px;padding:0 12px 0 8px;min-height:44px;cursor:pointer;font-size:.92rem}
.chip svg{width:18px;height:18px;stroke:var(--c);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);font-weight:700}
.chip .n{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--brand);color:var(--on-brand);font-size:.7rem;display:flex;align-items:center;justify-content:center;font-weight:700}
.intro h2{font-family:var(--f-display);font-weight:800;font-size:1.5rem;line-height:1.15;margin:8px 0 4px;text-wrap:balance}
.intro p{color:var(--muted);margin:0 0 14px;font-size:.92rem}
.sub{color:var(--muted);margin:-4px 0 10px;font-size:.88rem}
.setupfoot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:4}
.setupfoot div{max-width:448px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.setupfoot p{margin:0;font-size:.85rem;color:var(--muted)}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field span{line-height:1.25}
.field small{display:block;color:var(--muted);font-size:.8rem}
.confirm{border:2px solid var(--bad);border-radius:14px;padding:12px;margin-top:10px}
.confirm p{margin:0 0 10px}
.confirm div{display:flex;gap:8px;flex-wrap:wrap}
.loading{padding:40px 16px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.extras{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 14px}
.xchip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:12px;padding:0 12px 0 8px;min-height:44px;cursor:pointer;font-size:.88rem;color:var(--ink)}
.xchip svg{width:18px;height:18px;stroke:var(--c);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.xchip b{color:var(--muted);font-weight:700;margin-left:2px}
.checkin h3{margin:0 0 2px;font-size:1rem}
.checkin p{margin:0 0 10px;color:var(--muted);font-size:.86rem}
.feel{display:flex;gap:6px;margin-bottom:10px}
.feel button{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700}
.feel button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.feelkey{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);margin:-6px 0 10px}
.checkin .chips{margin-bottom:10px}
.checkin input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px;padding:0 10px;margin-bottom:10px}
.checkin .row{display:flex;gap:8px;flex-wrap:wrap}
.warn{border:2px solid var(--bad);border-radius:12px;padding:10px 12px;font-size:.88rem;margin-bottom:10px}
.tl .note{display:block;color:var(--muted);font-size:.8rem;white-space:normal}
.cols{display:block}
.narrow{max-width:640px}
@media (min-width:900px){
  .app{max-width:1040px}
  .appbar{padding:20px 28px 10px}
  main{padding:4px 28px 110px}
  .cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
  .tiles .tile{min-height:100px}
  .navbar div{max-width:560px}
  .toast{max-width:560px}
}
</style>

<div class="app">
  <header class="appbar" id="appbar">
    <div><div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="var(--brand)"/><rect x="7" y="17" width="9" height="6" rx="3" fill="var(--on-brand)"/><rect x="18" y="17" width="6" height="6" rx="3" fill="var(--on-brand)" opacity=".6"/><circle cx="29" cy="20" r="3" fill="var(--on-brand)"/></svg>Habitrak 3.0</div>
    <h1 id="title">Today</h1><p id="sub"></p></div>
    <span class="save" id="save" role="status">Loading…</span>
  </header>
  <main id="main"><p class="loading">Opening your log…</p></main>
</div>
<nav class="navbar" id="navbar" aria-label="Sections" hidden><div id="navbtns"></div></nav>
<div class="setupfoot" id="setupfoot" hidden><div><p id="setupcount"></p><button type="button" class="pill" id="setupnext">Next</button></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toastmsg"></span><button type="button" id="toastundo">Undo</button></div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};

  drink:'<path d="M6 4h12l-1.5 9a4.5 4.5 0 0 1-9 0z"/><path d="M12 17.5V21M8 21h8M7 8h10"/>',
  meds:'<rect x="3" y="9" width="18" height="7" rx="3.5" transform="rotate(-35 12 12.5)"/><path d="M10 9l4 6"/>',
  snack:'<path d="M12 8c-3.5-2-7.5 0-7 5s3.5 8 7 6c3.5 2 6.5-1 7-6s-3.5-7-7-5z"/><path d="M12 8c0-2 1-3.5 3-4"/>',
  work:'<rect x="3" y="7.5" width="18" height="12" rx="2"/><path d="M9 7.5V5h6v2.5M3 13h18"/>',
  walk:'<circle cx="13" cy="4.5" r="1.8"/><path d="M10 21l2.5-6 2.5 2.5V21M8 12l3.5-4 3 2.5 3 1M12.5 15l-1-5"/>',

  rest:'<path d="M4 12v5h16v-5M6 12V8h12v4M5 17v2M19 17v2"/>',
  screen:'<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/>',
  sleep:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  stretch:'<circle cx="12" cy="4.5" r="1.8"/><path d="M4.5 6.5L12 9l7.5-2.5M12 9v5M12 14l-3.5 7M12 14l3.5 7"/>',
  workout:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>'
};
var CAT={
  coffee:{n:"Coffee",k:"m"}, water:{n:"Water",k:"m"}, meal:{n:"Meal",k:"m"}, snack:{n:"Snack",k:"m"},
  smoke:{n:"Smoke",k:"m"}, drink:{n:"Drink",k:"m"}, meds:{n:"Meds",k:"m"},
  work:{n:"Work",k:"s"}, walk:{n:"Walk",k:"s"}, commute:{n:"Commute",k:"s"}, rest:{n:"Rest",k:"s"}, screen:{n:"Screen time",k:"s"}, sleep:{n:"Sleep",k:"s"}, stretch:{n:"Stretch",k:"s"}, workout:{n:"Workout",k:"s"}
};
var SYMPTOMS=[["tired","Tired"],["foggy","Foggy"],["headache","Headache"],["nausea","Nausea"],["anxious","Anxious"],["shaky","Shaky"],["sweaty","Sweaty"],["fine","Fine"]];
var MAX=9, FIRST_RUN=["coffee","work","water","walk","meal"];
var MIN=60000, DAY=86400000;
function col(id){return "var(--t-"+id+")";}
function svg(id){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+IC[id]+'</svg>';}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmt(t){return new Date(t).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});}
function hm(t){var d=new Date(t);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function dur(ms){var m=Math.max(0,Math.round(ms/MIN)); if(m<1) return "<1m"; return m<60? m+"m" : Math.floor(m/60)+"h"+(m%60? " "+(m%60)+"m":"");}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function lower(tr){return CAT[tr].n.toLowerCase();}
function done(e){return !e.as;}
function myTz(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||"";}catch(e){return "";}}

/* ---------- settings and day math ---------- */
var S=null;               // {sel, goals, dayStart, setup, tz}
function startHM(){var p=(S&&S.dayStart||"05:00").split(":");return [+p[0]||0,+p[1]||0];}
function keyOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function windowStart(key){var p=key.split("-"),h=startHM();return new Date(+p[0],+p[1]-1,+p[2],h[0],h[1],0,0).getTime();}
function dayKey(t){var d=new Date(t),h=startHM(),s=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h[0],h[1]); if(s.getTime()>t) s=new Date(d.getFullYear(),d.getMonth(),d.getDate()-1,h[0],h[1]); return keyOf(s);}
function shift(key,n){var p=key.split("-");return keyOf(new Date(+p[0],+p[1]-1,+p[2]+n));}
function windowEnd(key){return windowStart(shift(key,1));}
function emptyDay(){return {entries:[],checkin:null};}
function normDay(o){ o=o||{}; return {entries:(o.entries||[]).filter(function(e){return e&&CAT[e.tr]&&typeof e.t==="number";}).map(function(e){var x={id:e.id,tr:e.tr,t:e.t}; if(CAT[e.tr].k==="s") x.end=e.end==null?null:e.end; if(e.as) x.as=e.as; if(e.note) x.note=e.note; if(e.src) x.src=e.src; return x;}), checkin:o.checkin||null}; }

/* ---------- storage: private per-person db, or this browser ---------- */
var store=null, days={}, writing={}, dirty={}, saveState="ok";
function setSave(state,text){ saveState=state; var el=$("save"); el.textContent=text; el.className="save"+(state==="err"?" err":""); }
function remoteStore(db,uid){
  var base="data/users/"+uid, profile=db.doc(base+"/profile"), dayCol=profile.collection("days"), imp=db.doc(base+"/import-v2");
  return {
    kind:"account",
    loadSettings:function(){return profile.get().then(function(s){return s.exists? s.data() : null;});},
    saveSettings:function(o){return profile.set(o);},
    watchDay:function(key,cb){return dayCol.doc(key).onSnapshot(function(s){cb(normDay(s.exists? s.data() : null));},function(e){onStoreError(e);});},
    getDay:function(key){return dayCol.doc(key).get().then(function(s){return normDay(s.exists? s.data() : null);});},
    saveDay:function(key,day){return (day.entries.length||day.checkin)? dayCol.doc(key).set({entries:day.entries,checkin:day.checkin||null,updated:Date.now()}) : dayCol.doc(key).delete();},
    getImport:function(){return imp.get().then(function(s){return s.exists? s.data() : null;});},
    markImported:function(n){return imp.update({done:true,doneAt:Date.now(),imported:n});},
    erase:function(){return dayCol.get().then(function(q){var p=Promise.resolve(); q.docs.forEach(function(d){p=p.then(function(){return dayCol.doc(d.id).delete();});}); return p;}).then(function(){return profile.delete();});}
  };
}
function localStore(){
  function get(k){try{var v=localStorage.getItem("habitrak3:"+k);return v?JSON.parse(v):null;}catch(e){return null;}}
  function put(k,v){try{ if(v==null) localStorage.removeItem("habitrak3:"+k); else localStorage.setItem("habitrak3:"+k,JSON.stringify(v)); }catch(e){}}
  return {
    kind:"device",
    loadSettings:function(){return Promise.resolve(get("profile"));},
    saveSettings:function(o){put("profile",o);return Promise.resolve();},
    watchDay:function(key,cb){cb(normDay(get("day:"+key)));return function(){};},
    getDay:function(key){return Promise.resolve(normDay(get("day:"+key)));},
    saveDay:function(key,day){put("day:"+key,(day.entries.length||day.checkin)?{entries:day.entries,checkin:day.checkin||null}:null);return Promise.resolve();},
    getImport:function(){return Promise.resolve(null);},
    markImported:function(){return Promise.resolve();},
    erase:function(){try{Object.keys(localStorage).filter(function(k){return k.indexOf("habitrak3:")===0;}).forEach(function(k){localStorage.removeItem(k);});}catch(e){} return Promise.resolve();}
  };
}
function onStoreError(e){
  var code=e&&e.code;

  else if(code==="revoked"||code==="not_granted") setSave("err","Not saving");
  else setSave("err","Not saved");
}
function savedLabel(){ return store.kind==="account"? "Saved to your account" : "Saved on this device"; }
function persistDay(key){
  dirty[key]=true; if(writing[key]) return; writing[key]=true; setSave("busy","Saving…");
  (function loop(){
    if(!dirty[key]){ writing[key]=false; if(saveState!=="err") setSave("ok",savedLabel()); return; }
    dirty[key]=false;
    store.saveDay(key,normDay(days[key])).then(function(){ if(saveState==="err") setSave("ok",savedLabel()); loop(); },function(err){ onStoreError(err); writing[key]=false; });
  })();
}
var settingsBusy=false, settingsDirty=false;
function persistSettings(){
  settingsDirty=true; if(settingsBusy) return; settingsBusy=true;
  (function loop(){
    if(!settingsDirty){ settingsBusy=false; return; }
    settingsDirty=false;
    store.saveSettings({sel:S.sel,goals:S.goals,dayStart:S.dayStart,setup:!!S.setup,tz:S.tz||myTz()}).then(loop,function(err){onStoreError(err); settingsBusy=false;});
  })();

/* ---------- live day subscriptions (today and yesterday) ---------- */
var subs={}, todayKey=null;
function watch(key){
  if(subs[key]) return;
  subs[key]=store.watchDay(key,function(day){
    if(writing[key]||dirty[key]) return;           // our own write is in flight; keep local state
    days[key]=day; render();
  });
}
function syncDays(){
  var k=dayKey(Date.now());
  if(k===todayKey) return false;
  todayKey=k;
  var keep=[k,shift(k,-1)];
  Object.keys(subs).forEach(function(x){ if(keep.indexOf(x)<0){ try{subs[x]();}catch(e){} delete subs[x]; } });
  keep.forEach(function(x){ if(!days[x]) days[x]=emptyDay(); watch(x); });
  return true;
}

/* ---------- queries over loaded entries ---------- */
function liveEntries(){ var out=[]; [todayKey,shift(todayKey,-1)].forEach(function(k){ ((days[k]||{}).entries||[]).forEach(function(e){ e._day=k; out.push(e); }); }); return out; }
function running(){ var r=null; liveEntries().forEach(function(e){ if(CAT[e.tr].k==="s"&&e.end==null&&(!r||e.t>r.t)) r=e; }); return r; }
function overlaps(e,a,b){ if(CAT[e.tr].k==="m") return e.t>=a&&e.t<b; var end=e.end==null?Date.now():e.end; return end>a&&e.t<b; }
function todayEntries(){ var a=windowStart(todayKey), b=windowEnd(todayKey); return liveEntries().filter(function(e){return overlaps(e,a,b);}); }
function countToday(tr,as){ var a=windowStart(todayKey); return liveEntries().filter(function(e){return e.tr===tr&&e.t>=a&&(as? e.as===as : done(e));}).length; }
function lastOf(tr){ var l=null; liveEntries().forEach(function(e){ if(e.tr===tr&&done(e)&&(!l||e.t>l.t)) l=e; }); return l; }

/* ---------- ribbon ---------- */
function ribbon(entries,start,opts){
  opts=opts||{}; var W=240,H=opts.h||28,n=Date.now();
  function x(t){return Math.max(0,Math.min(W,(t-start)/DAY*W));}
  var s='<svg class="ribbon" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(opts.label||"Day ribbon")+'">';
  s+='<rect x="0" y="'+(H*0.3)+'" width="'+W+'" height="'+(H*0.55)+'" rx="'+(H*0.2)+'" fill="var(--hatch)"/>';
  entries.forEach(function(e){ if(CAT[e.tr].k!=="s") return; var a=x(e.t), b=x(e.end==null?n:e.end); if(b-a<0.3) return;
    s+='<rect x="'+a.toFixed(2)+'" y="'+(H*0.3)+'" width="'+(b-a).toFixed(2)+'" height="'+(H*0.55)+'" rx="1.5" fill="'+col(e.tr)+'"/>'; });
  var r=(H>30?2.6:2.2);
  entries.forEach(function(e){ if(CAT[e.tr].k!=="m"||e.t<start||e.t>start+DAY) return;
    s+= done(e)? '<circle cx="'+x(e.t).toFixed(2)+'" cy="'+(H*0.14+1)+'" r="'+r+'" fill="'+col(e.tr)+'"/>'
               : '<circle cx="'+x(e.t).toFixed(2)+'" cy="'+(H*0.14+1)+'" r="'+(r-0.5)+'" fill="none" stroke="'+col(e.tr)+'" stroke-width="1"/>'; });
  if(opts.now){ var a=x(n); s+='<rect x="'+(a-0.6).toFixed(2)+'" y="'+(H*0.22)+'" width="1.2" height="'+(H*0.72)+'" fill="var(--ink)"/>'; }
  return s+'</svg>';
}
function hourLabels(indent){

/* ---------- tiles ---------- */

function addEntry(e){ var k=dayKey(e.t); if(!days[k]) days[k]=emptyDay(); days[k].entries.push(e); persistDay(k); return k; }
function removeEntry(e){ var k=e._day||dayKey(e.t); if(!days[k]) return; days[k].entries=days[k].entries.filter(function(x){return x.id!==e.id;}); persistDay(k); }

function find(id){ var r=null; liveEntries().forEach(function(e){ if(e.id===id) r=e; }); return r; }

    moments.map(function(t){ var rs=inWeek.filter(function(e){return e.tr===t&&e.as==="resisted";}).length;
      return '<tr><td>'+esc(CAT[t].n)+(rs?' <span style="color:var(--muted)">· '+rs+' resisted this week</span>':'')+'</td><td>'+(all.filter(function(e){return e.tr===t;}).length/den).toFixed(1)+'</td></tr>';}).join("")+
    S.sel.filter(function(t){return CAT[t].k==="s"&&t!=="sleep";}).map(function(t){ var ms=all.filter(function(e){return e.tr===t;}).reduce(function(x,e){return x+((e.end==null?Date.now():e.end)-e.t);},0); return '<tr><td>'+esc(CAT[t].n)+'</td><td>'+dur(ms/den)+'</td></tr>';}).join("")+
    '</table></div>';
  if(S.sel.indexOf("sleep")>=0){
    var nights=[];
    rows.slice().reverse().forEach(function(k){ var st=windowStart(k), en=windowEnd(k), s=null;
      pool.forEach(function(e){ if(e.tr==="sleep"&&e.end!=null&&e.end>=st&&e.end<en&&e.end-e.t>=60*MIN&&(!s||e.end-e.t>s.end-s.t)) s=e; });
      if(s) nights.push({k:k,s:s,c:dayOf(k).checkin}); });
    b+='<p class="lbl2">Last 7 nights</p><div class="card">';
    if(!nights.length) b+='<p class="empty">Tap Sleep when you go to bed and again when you wake up. Your nights show here.</p>';
    else b+='<table class="tot"><tr><td style="color:var(--muted);font-size:.78rem">Woke</td><td style="color:var(--muted);font-size:.78rem;text-align:left">Bed to wake</td><td style="color:var(--muted);font-size:.78rem">Felt</td></tr>'+nights.map(function(x){
      var w=new Date(x.s.end), c=x.c;
      return '<tr><td>'+w.toLocaleDateString([], {weekday:"short",day:"numeric"})+'</td><td style="text-align:left;font-weight:500">'+fmt(x.s.t)+'–'+fmt(x.s.end)+' · '+dur(x.s.end-x.s.t)+'</td><td>'+(c&&c.feel? c.feel+" of 5" : "–")+'</td></tr>'; }).join("")+'</table>';
    b+='</div>';
  }
  m.innerHTML='<div class="cols"><div>'+a+'</div><div>'+b+'</div></div>';
}

function renderGoals(m){
  head("Goals","Optional, for anything you want less of");
  var mom=S.sel.filter(function(t){return CAT[t].k==="m";});
  var h='<div class="narrow"><div class="obs">A ceiling is a line to stay under, not an amount to use up. Setting a goal also adds a Resisted button on Today.</div>';
  if(!mom.length){ m.innerHTML=h+'<p class="empty">Goals work on moments like Coffee or Smoke. Add one in Trackers.</p></div>'; return; }
  h+='<div class="card">'+mom.map(function(t){ var g=S.goals[t]||{cap:0,wait:0}, n=esc(CAT[t].n);
    return '<div class="goal" style="--c:'+col(t)+'"><span class="gi">'+svg(t)+'</span><b>'+n+'</b><div class="rows">'+
      '<div class="step"><span>Most a day<b>'+(g.cap||"Off")+'</b></span><div><button type="button" data-g="'+t+'" data-f="cap" data-d="-1" aria-label="Lower '+n+' daily most">−</button><button type="button" data-g="'+t+'" data-f="cap" data-d="1" aria-label="Raise '+n+' daily most">+</button></div></div>'+
      '<div class="step"><span>Wait between<b>'+(g.wait?dur(g.wait*MIN):"Off")+'</b></span><div><button type="button" data-g="'+t+'" data-f="wait" data-d="-15" aria-label="Shorter wait for '+n+'">−</button><button type="button" data-g="'+t+'" data-f="wait" data-d="15" aria-label="Longer wait for '+n+'">+</button></div></div>'+
      '</div></div>'; }).join("")+'</div></div>';
  m.innerHTML=h;
  m.querySelectorAll("[data-g]").forEach(function(b){b.addEventListener("click",function(){
    var t=b.dataset.g, f=b.dataset.f, g=S.goals[t]||(S.goals[t]={cap:0,wait:0});
    g[f]=Math.max(0,Math.min(f==="cap"?40:240,(g[f]||0)+(+b.dataset.d))); persistSettings(); render(); });});
}

function pickerHTML(){
  function grp(k,title,sub){ return '<p class="lbl2">'+title+'</p><p class="sub">'+sub+'</p><div class="chips">'+Object.keys(CAT).filter(function(t){return CAT[t].k===k;}).map(function(t){var i=S.sel.indexOf(t);
    return '<button type="button" class="chip" data-pick="'+t+'" aria-pressed="'+(i>=0)+'" style="--c:'+col(t)+'">'+svg(t)+esc(CAT[t].n)+(i>=0?'<span class="n" aria-label="position '+(i+1)+'">'+(i+1)+'</span>':'')+'</button>';}).join("")+'</div>'; }
  return grp("m","Moments","Tap when it happens.")+grp("s","Stretches","Tap to start, tap again to stop.");
}
function bindPicker(m,onChange){
  m.querySelectorAll("[data-pick]").forEach(function(b){b.addEventListener("click",function(){ var t=b.dataset.pick, i=S.sel.indexOf(t);
    if(i>=0){ if(S.sel.length>1) S.sel.splice(i,1); else { toast("Keep at least one tracker",null); return; } }
    else if(S.sel.length<MAX) S.sel.push(t); else { toast(MAX+" is the most. Remove one first.",null); return; }
    onChange(); render(); });});
}
function renderTrackers(m){
  head("Trackers","What shows on Today, in this order");
  var h='<div class="narrow"><p class="sub" style="margin-top:0">Up to '+MAX+'. The numbers set the order of your tiles. '+S.sel.length+' of '+MAX+' picked.</p>'+pickerHTML();
  h+='<p class="lbl2">Settings</p><div class="card"><div class="field"><span>Day starts at<small>Late nights before this time count as the day before.</small></span><input type="time" id="daystart" value="'+esc(S.dayStart)+'" aria-label="Day starts at"></div>'+
     '<div class="field"><span>Where your log is saved<small>'+(store.kind==="account"?"In your Claude account. Only you can see it, on any device where you're signed in.":"In this browser only. Open Habitrak inside Claude to save to your account.")+'</small></span></div>'+
     '<div class="field"><span>Erase everything<small>Every entry, goal and tracker choice. This can\'t be undone.</small></span><button type="button" class="pill danger" id="erase">Erase</button></div></div>';
  if(confirmErase) h+='<div class="confirm" id="confirmbox"><p><b>Erase your whole Habitrak log?</b> This can\'t be undone.</p><div><button type="button" class="pill danger" id="erase-yes">Erase everything</button><button type="button" class="pill tonal" id="erase-no">Keep it</button></div></div>';
  m.innerHTML=h+'</div>';
  bindPicker(m,persistSettings);
  $("daystart").addEventListener("change",function(ev){ if(!ev.target.value) return; S.dayStart=ev.target.value; persistSettings(); todayKey=null; syncDays(); weekCache=null; render(); });
  $("erase").addEventListener("click",function(){ confirmErase=true; render(); var b=$("confirmbox"); if(b) b.scrollIntoView({block:"nearest"}); });
  if(confirmErase){
    $("erase-no").addEventListener("click",function(){ confirmErase=false; render(); });
    $("erase-yes").addEventListener("click",function(){ $("erase-yes").disabled=true; setSave("busy","Erasing…");
      Object.keys(subs).forEach(function(x){ try{subs[x]();}catch(e){} }); subs={}; days={}; todayKey=null;
      store.erase().then(function(){ S={sel:FIRST_RUN.slice(),goals:{},dayStart:"05:00",setup:false,tz:myTz()}; setupStep=1; confirmErase=false; tab="today"; setSave("ok",savedLabel()); syncDays(); render(); toast("Everything erased",null); },
        function(e){ onStoreError(e); confirmErase=false; syncDays(); render(); toast("Couldn't erase everything. Try again.",null); }); });
  }
}

/* ---------- first run ---------- */
var setupStep=1, importedCount=0;
function renderSetup(m){
  if(setupStep===1){
    head("Welcome","Let's set up your day");
    m.innerHTML='<div class="narrow"><div class="intro"><h2>What do you want to keep track of?</h2><p>Pick up to '+MAX+'. Change anytime.'+(importedCount?' Your Habitrak 2.0 trackers are already picked.':'')+'</p></div>'+pickerHTML()+'</div>';
    bindPicker(m,function(){});
    $("setupcount").textContent=S.sel.length+" of "+MAX+" picked";
    $("setupnext").textContent="Next";
  } else {
    head("Welcome","One more thing");
    m.innerHTML='<div class="narrow"><div class="intro"><h2>When does your day start?</h2><p>Your day ribbon runs 24 hours from this time. Late nights before it count as the day before.</p></div>'+
      '<div class="card"><div class="field"><span>Day starts at</span><input type="time" id="setup-start" value="'+esc(S.dayStart)+'" aria-label="Day starts at"></div></div>'+
      '<p class="sub">Your log is saved '+(store.kind==="account"?"to your Claude account, and only you can see it.":"in this browser only.")+' No sign-up needed.'+(importedCount?' Your '+importedCount+' entries from Habitrak 2.0 are already here.':'')+'</p></div>';
    $("setup-start").addEventListener("change",function(ev){ if(ev.target.value) S.dayStart=ev.target.value; });
    $("setupcount").textContent="";
    $("setupnext").textContent="Start tracking";
  }
}
$("setupnext").addEventListener("click",function(){
  if(setupStep===1){ setupStep=2; render(); window.scrollTo(0,0); return; }
  S.setup=true; persistSettings(); todayKey=null; syncDays(); tab="today"; render(); toast("You're set. Tap a tile when something happens.",null);
});

/* ---------- one-time import from Habitrak 2.0 (staged by Claude in this artifact's private storage) ---------- */
function runImport(imp){
  var list=(imp.entries||[]).filter(function(e){return e&&CAT[e.tr]&&typeof e.t==="number";});
  var byKey={};
  list.forEach(function(e){ var k=dayKey(e.t); (byKey[k]=byKey[k]||{entries:[],checkin:null}).entries.push(e); });
  (imp.checkins||[]).forEach(function(c){ if(!c||typeof c.wake!=="number") return; var k=dayKey(c.wake); (byKey[k]=byKey[k]||{entries:[],checkin:null}).checkin=c.checkin; });
  var keys=Object.keys(byKey).sort(), n=0;
  return keys.reduce(function(p,k){ return p.then(function(){ return store.getDay(k).then(function(day){
      var have={}; day.entries.forEach(function(e){ have[e.id]=1; });
      byKey[k].entries.forEach(function(e){ if(!have[e.id]){ day.entries.push(e); n++; } });
      if(!day.checkin&&byKey[k].checkin) day.checkin=byKey[k].checkin;
      day=normDay(day); if(days[k]) days[k]=day;
      return store.saveDay(k,day); }); }); }, Promise.resolve())
    .then(function(){ return store.markImported(n); }).then(function(){ return n; });
}

/* ---------- render ---------- */
function render(){
  if(!S||!store) return;
  var m=$("main"), setup=!S.setup;
  $("navbar").hidden=setup; $("setupfoot").hidden=!setup;
  if(setup){ renderSetup(m); return; }
  if(!todayKey) syncDays();
  renderNav();
  ({today:renderToday,week:renderWeek,goals:renderGoals,trackers:renderTrackers}[tab]||renderToday)(m);
}
setInterval(function(){
  if(!S||!store||!S.setup) return;
  var rolled=syncDays();
  var a=document.activeElement, typing=a&&(a.tagName==="INPUT");
  if((tab==="today"&&editing==null&&!typing)||rolled) render();
},30000);

/* ---------- boot ---------- */
function boot(st){
  store=st; setSave("ok",savedLabel());
  Promise.all([store.loadSettings(), store.getImport().catch(function(){return null;})]).then(function(r){
    var o=r[0], imp=r[1];
    if(o&&o.sel) S={sel:o.sel.filter(function(t){return CAT[t];}).slice(0,MAX),goals:o.goals||{},dayStart:o.dayStart||"05:00",setup:!!o.setup,tz:o.tz||""};
    else if(imp&&!imp.done) S={sel:(imp.sel||FIRST_RUN).filter(function(t){return CAT[t];}).slice(0,MAX),goals:imp.goals||{},dayStart:imp.dayStart||"05:00",setup:false,tz:""};
    else S={sel:FIRST_RUN.slice(),goals:{},dayStart:"05:00",setup:false,tz:""};
    if(!S.sel.length) S.sel=FIRST_RUN.slice();
    if(S.tz!==myTz()){ S.tz=myTz(); if(o) persistSettings(); }
    var go=function(){ if(S.setup) syncDays(); render(); };
    if(imp&&!imp.done){
      setSave("busy","Bringing in Habitrak 2.0…");
      runImport(imp).then(function(n){ importedCount=n; setSave("ok",savedLabel()); weekCache=null; go(); if(n&&S.setup) toast(n+" entries from Habitrak 2.0 are in your log",null); },
        function(e){ onStoreError(e); go(); toast("Couldn't bring in Habitrak 2.0 yet. It will try again next time.",null); });
      if(!S.setup) render();
    } else go();
  },function(e){ onStoreError(e); S={sel:FIRST_RUN.slice(),goals:{},dayStart:"05:00",setup:false,tz:myTz()}; render(); });
}
(function(){
  var c=window.claude;
  if(!c||typeof c.use!=="function"){ boot(localStore()); return; }
  Promise.all([c.use("db"),c.use("user")]).then(function(r){
    var db=r[0], user=r[1];
    if(!db||!user||typeof user.id!=="function") return boot(localStore());
    return Promise.resolve(user.id()).then(function(uid){ boot(uid? remoteStore(db,uid) : localStore()); });
  }).catch(function(){ boot(localStore()); });
})();
})();
</script>
